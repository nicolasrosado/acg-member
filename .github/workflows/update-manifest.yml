name: Update Manifest

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'data/achievements.json'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update manifest from content
        run: node scripts/update-manifest.js

      - name: Commit updated manifest
        run: |
          git config user.name "ACG Bot"
          git config user.email "acg-bot@users.noreply.github.com"
          git add manifest.json data/local-stats.json
          git diff --cached --quiet || git commit -m "Auto-update manifest from content changes"
          git push
